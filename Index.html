<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Babilonia777</title>
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💬</text></svg>">
  <style>
    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    :root {
      --bg: #0f0f11;
      --bg-panel: #1c1c1f;
      --border: rgba(255,255,255,0.08);
      --text: #f4f4f5;
      --text-dim: #a1a1aa;
      --accent: #22c55e;
      --danger: #ef4444;
      --warn: #f59e0b;
      --radius-lg: 28px;
      --radius-md: 16px;
      --radius-pill: 999px;
      --shadow: 0 10px 40px rgba(0,0,0,0.5);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }

    html, body {
      height: 100%; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-size: 16px; -webkit-font-smoothing: antialiased;
      user-select: none;
    }
    body { padding-top: var(--safe-top); padding-bottom: var(--safe-bottom); }

    /* ==================== PANTALLA LOGIN ==================== */
    .welcome-screen {
      position: fixed; inset: 0; z-index: 5000;
      background: var(--bg);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px;
    }
    .welcome-card {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 40px 24px 30px;
      width: 100%; max-width: 360px;
      box-shadow: var(--shadow);
      text-align: center;
    }
    .welcome-icon {
      width: 64px; height: 64px; border-radius: 50%;
      background: rgba(34, 197, 94, 0.15);
      color: var(--accent);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 30px;
    }
    .welcome-icon svg { width: 32px; height: 32px; }
    .input-group { text-align: left; margin-bottom: 16px; }
    .welcome-input {
      width: 100%; padding: 16px; border-radius: var(--radius-md);
      background: rgba(255,255,255,0.05); border: 1px solid var(--border);
      color: var(--text); font-size: 16px; outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .welcome-input:focus { border-color: var(--accent); background: rgba(255,255,255,0.08); }
    .welcome-input::placeholder { color: var(--text-dim); }
    .welcome-btn {
      width: 100%; padding: 16px; border-radius: var(--radius-md);
      background: var(--accent); color: #fff; border: none;
      font-size: 16px; font-weight: 600; cursor: pointer;
      transition: all 0.2s; margin-top: 10px;
    }
    .welcome-btn:active { transform: scale(0.98); opacity: 0.9; }
    .welcome-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .warning-note {
      margin-top: 24px; font-size: 12px; color: var(--danger);
      line-height: 1.4; display: flex; align-items: center; justify-content: center;
      gap: 6px; padding: 0 10px; opacity: 0.9;
    }
    .warning-note svg { width: 16px; height: 16px; flex-shrink: 0; }

    /* ==================== BOTÓN NOTIFICACIONES (LOGIN) ==================== */
    .notif-toggle-btn {
      width: 100%;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin-top: 14px; padding: 12px 16px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.03);
      color: var(--text-dim);
      font-size: 14px; font-weight: 500;
      cursor: pointer; transition: all 0.2s;
    }
    .notif-toggle-btn:active { transform: scale(0.98); }
    .notif-toggle-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
    .notif-toggle-btn.enabled {
      background: rgba(34, 197, 94, 0.12);
      border-color: rgba(34, 197, 94, 0.4);
      color: var(--accent);
    }
    .notif-toggle-btn.blocked {
      background: rgba(239, 68, 68, 0.1);
      border-color: rgba(239, 68, 68, 0.3);
      color: var(--danger);
    }
    .notif-toggle-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    /* ==================== BOTÓN FLOTANTE NOTIFICACIONES ==================== */
    .notif-float-btn {
      position: fixed;
      top: calc(var(--safe-top) + 16px);
      right: 16px;
      width: 48px; height: 48px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: rgba(28, 28, 31, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--text-dim);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      z-index: 2000;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      animation: floatIn 0.4s ease;
    }
    @keyframes floatIn { from { opacity: 0; transform: scale(0.7); } to { opacity: 1; transform: scale(1); } }
    .notif-float-btn svg { width: 22px; height: 22px; transition: transform 0.2s; }
    .notif-float-btn:active { transform: scale(0.9); }
    .notif-float-btn.off {
      color: var(--warn);
      border-color: rgba(245, 158, 11, 0.4);
      animation: floatIn 0.4s ease, bell-pulse 2s infinite 0.6s;
    }
    @keyframes bell-pulse {
      0%, 100% { box-shadow: 0 4px 16px rgba(0,0,0,0.4), 0 0 0 0 rgba(245, 158, 11, 0.5); }
      50% { box-shadow: 0 4px 16px rgba(0,0,0,0.4), 0 0 0 10px rgba(245, 158, 11, 0); }
    }
    .notif-float-btn.on {
      color: var(--accent);
      border-color: rgba(34, 197, 94, 0.5);
      background: rgba(34, 197, 94, 0.15);
    }
    .notif-float-btn.blocked {
      color: var(--danger);
      border-color: rgba(239, 68, 68, 0.4);
      background: rgba(239, 68, 68, 0.12);
    }
    .notif-float-btn::after {
      content: '';
      position: absolute;
      bottom: 2px; right: 2px;
      width: 10px; height: 10px;
      border-radius: 50%;
      border: 2px solid var(--bg-panel);
      background: var(--text-dim);
    }
    .notif-float-btn.on::after { background: var(--accent); }
    .notif-float-btn.off::after { background: var(--warn); }
    .notif-float-btn.blocked::after { background: var(--danger); }

    /* ==================== CHAT ==================== */
    .chat-container { width: 100%; height: 100%; display: flex; flex-direction: column; }
    .chat-messages {
      flex: 1; overflow-y: auto;
      padding: 80px 16px 100px;
      display: flex; flex-direction: column; gap: 8px;
      scroll-behavior: smooth;
    }
    .message {
      max-width: min(85%, 560px);
      padding: 10px 16px;
      border-radius: 20px;
      line-height: 1.45;
      word-wrap: break-word;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      animation: fadeIn .2s ease forwards;
      position: relative;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .message.sent {
      align-self: flex-end; border-bottom-right-radius: 6px;
      color: #fff; background: linear-gradient(135deg, var(--accent), #16a34a);
    }
    .message.received {
      align-self: flex-start; border-bottom-left-radius: 6px;
      color: #111; background: #e4e4e7;
    }
    .message-username {
      font-size: 12px; font-weight: 700; margin-bottom: 4px;
      opacity: 0.8; display: block;
    }
    .message.sent .message-username { color: rgba(255,255,255,0.9); }
    .message.received .message-username { color: rgba(0,0,0,0.6); }
    .message-text { font-size: 15px; }
    .message-image-container { margin-top: 8px; border-radius: 14px; overflow: hidden; max-width: 100%; }
    .message-image { max-width: 100%; max-height: 400px; display: block; cursor: pointer; }
    .message-audio-container { margin-top: 8px; background: rgba(0,0,0,0.15); border-radius: 12px; padding: 8px; }
    .message-audio { width: 100%; height: 40px; outline: none; }

    .input-area {
      flex-shrink: 0;
      padding: 8px 16px max(16px, var(--safe-bottom));
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 1000;
    }
    .input-wrapper {
      display: flex; align-items: center; gap: 8px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      padding: 6px 6px 6px 12px;
      box-shadow: var(--shadow);
      transition: border-color 0.2s, background 0.2s;
    }
    .input-wrapper.recording { border-color: var(--danger); background: rgba(239, 68, 68, 0.05); }
    .icon-btn {
      width: 40px; height: 40px; border: none; background: transparent;
      color: var(--text-dim); border-radius: 50%; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all .2s; flex-shrink: 0;
    }
    .icon-btn svg { width: 22px; height: 22px; }
    .icon-btn.active { background: var(--accent); color: #fff; transform: rotate(45deg); }
    .cancel-audio-btn {
      display: none; width: 36px; height: 36px; border: none;
      background: rgba(239, 68, 68, 0.15); color: var(--danger);
      border-radius: 50%; cursor: pointer; flex-shrink: 0;
      align-items: center; justify-content: center;
    }
    .cancel-audio-btn svg { width: 18px; height: 18px; }
    .cancel-audio-btn.visible { display: flex; }
    .message-input {
      flex: 1; background: transparent; border: none;
      padding: 8px 0; font-size: 16px; color: var(--text); outline: none;
      min-width: 0;
    }
    .message-input::placeholder { color: var(--text-dim); }
    .message-input:disabled { opacity: 1; color: var(--danger); font-weight: 600; }
    .send-btn {
      width: 40px; height: 40px; border: none; background: var(--accent); color: #fff;
      border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all .2s; flex-shrink: 0;
    }
    .send-btn svg { width: 18px; height: 18px; margin-left: -2px; }
    .send-btn:active { transform: scale(0.92); }
    .send-btn.recording { background: var(--danger); animation: pulse-red 1.5s infinite; }
    @keyframes pulse-red {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
      70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    .attach-menu {
      position: absolute; bottom: calc(100% + 12px); left: 16px;
      display: flex; flex-direction: column; gap: 4px;
      background: var(--bg-panel); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 8px;
      box-shadow: var(--shadow);
      opacity: 0; transform: translateY(10px) scale(.95);
      transform-origin: bottom left; pointer-events: none;
      transition: all .25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .attach-menu.active { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
    .attach-option {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px; background: transparent; border: none;
      border-radius: var(--radius-md); color: var(--text);
      font-size: 15px; font-weight: 500; cursor: pointer;
      transition: background .2s;
    }
    .attach-option svg { width: 22px; height: 22px; color: var(--accent); }
    .attach-option:hover { background: rgba(255,255,255,0.06); }

    .overlay {
      display: none; position: fixed; inset: 0; z-index: 3000;
      align-items: center; justify-content: center; padding: 20px;
      background: rgba(0,0,0,0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    }
    .overlay.active { display: flex; animation: fadeIn .2s; }
    .modal-card {
      background: var(--bg-panel);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: var(--radius-lg);
      box-shadow: 0 24px 60px rgba(0,0,0,0.8);
      width: 100%; max-width: 380px;
      animation: slideUp .3s cubic-bezier(0.16, 1, 0.3, 1);
      overflow: hidden;
    }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 0; }
    .modal-title { font-size: 17px; font-weight: 600; color: var(--text); }
    .close-btn { width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.05); border: none; color: var(--text-dim); display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .close-btn svg { width: 16px; height: 16px; }
    .image-modal { padding-bottom: 20px; }
    .image-preview-box { padding: 16px 20px; }
    .image-preview-box img { width: 100%; max-height: 300px; object-fit: contain; background: #000; border-radius: var(--radius-md); display: block; }
    .image-input-box { padding: 0 20px 20px; }
    .image-input { width: 100%; padding: 14px 16px; border-radius: var(--radius-md); background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text); font-size: 15px; outline: none; }
    .image-input:focus { border-color: var(--accent); }
    .image-actions { display: flex; gap: 12px; padding: 0 20px; }
    .btn-pill { padding: 14px 24px; border-radius: var(--radius-pill); font-size: 15px; font-weight: 600; border: none; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all .2s; }
    .btn-pill.cancel { background: rgba(255,255,255,0.05); color: var(--text-dim); }
    .btn-pill.send { background: var(--accent); color: #fff; }
    .btn-pill svg { width: 18px; height: 18px; }
    .upload-modal { padding: 30px; text-align: center; }
    .upload-title { font-size: 16px; font-weight: 600; margin-bottom: 20px; }
    .progress-bar { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 99px; overflow: hidden; margin-bottom: 12px; }
    .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width .3s; border-radius: 99px; }
    #uploadPercentage { font-size: 14px; color: var(--accent); font-weight: 600; }

    .camera-overlay { padding: 0; background: #000; backdrop-filter: none; }
    .camera-container { display: flex; flex-direction: column; height: 100%; width: 100%; max-width: 560px; background: #000; }
    .camera-preview { flex: 1; position: relative; background: #0a0a0a; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    #cameraVideoElement { width: 100%; height: 100%; object-fit: cover; display: none; transition: transform 0.3s; }
    .camera-preview-result { width: 100%; height: 100%; object-fit: contain; display: none; background: #000; }
    .camera-corner-actions { position: absolute; top: 20px; right: 20px; display: flex; flex-direction: column; gap: 12px; z-index: 10; }
    .camera-icon-btn { width: 44px; height: 44px; border-radius: 50%; border: none; background: rgba(0,0,0,0.6); color: #fff; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); transition: background 0.2s; }
    .camera-icon-btn svg { width: 20px; height: 20px; }
    .camera-icon-btn:active { background: rgba(0,0,0,0.8); }
    .camera-icon-btn.flash-active { background: var(--warn); color: #000; }
    .camera-close-btn { position: absolute; top: 20px; left: 20px; z-index: 10; }
    .camera-bottom-bar { padding: 24px; background: #000; display: flex; justify-content: center; align-items: center; gap: 16px; border-top: 1px solid var(--border); }
    .camera-capture-btn { width: 72px; height: 72px; border-radius: 50%; border: 3px solid #fff; background: transparent; padding: 0; position: relative; }
    .camera-capture-btn::after { content: ''; position: absolute; inset: 6px; border-radius: 50%; background: #fff; transition: transform .15s; }
    .camera-capture-btn:active::after { transform: scale(0.9); }
    .btn-outline { padding: 12px 20px; border-radius: var(--radius-pill); background: transparent; border: 1px solid rgba(255,255,255,0.2); color: #fff; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  </style>
</head>
<body>
  <!-- PANTALLA DE LOGIN -->
  <div class="welcome-screen" id="welcomeScreen" style="display: none;">
    <div class="welcome-card">
      <div class="welcome-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </div>
      <div class="input-group">
        <input type="text" id="usernameInput" class="welcome-input" placeholder="Nombre de usuario" autocomplete="off" maxlength="15">
      </div>
      <div class="input-group">
        <input type="password" id="passwordInput" class="welcome-input" placeholder="Contraseña" maxlength="20">
      </div>
      <button id="loginBtn" class="welcome-btn">Registrarse</button>

      <!-- 🔔 BOTÓN DE NOTIFICACIONES EN LOGIN -->
      <button id="notifToggleBtn" class="notif-toggle-btn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <span id="notifToggleLabel">Activar notificaciones</span>
      </button>

      <div class="warning-note">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
          <line x1="12" y1="9" x2="12" y2="13"/>
          <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
        Por favor, anota tu usuario y contraseña en un lugar seguro.
      </div>
    </div>
  </div>

  <!-- 💬 CHAT -->
  <div class="chat-container" id="chatContainer" style="display: none;">
    <!-- 🔔 BOTÓN FLOTANTE DE NOTIFICACIONES -->
    <button id="notifFloatBtn" class="notif-float-btn off" type="button" title="Notificaciones">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
    </button>

    <div class="chat-messages" id="chatMessages"></div>

    <form class="input-area" id="messageForm" onsubmit="return false;">
      <div class="attach-menu" id="attachMenu">
        <button type="button" class="attach-option" id="micBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
          Audio
        </button>
        <button type="button" class="attach-option" id="cameraBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          Cámara
        </button>
        <button type="button" class="attach-option" id="galleryBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          Galería
        </button>
      </div>

      <div class="input-wrapper" id="inputWrapper">
        <button type="button" class="icon-btn" id="attachToggleBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <button type="button" class="cancel-audio-btn" id="cancelAudioBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
        <input type="text" class="message-input" id="messageInput" placeholder="Escribe un mensaje..." autocomplete="off">
        <button type="button" class="send-btn" id="mainSendBtn">
          <svg id="sendIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </form>
  </div>

  <input type="file" id="realFileInput" accept="image/*" style="display:none">
  <div id="imagePreviewModal" class="overlay">
    <div class="modal-card image-modal">
      <div class="modal-head">
        <div class="modal-title">Enviar imagen</div>
        <button class="close-btn" id="cancelImageBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="image-preview-box">
        <img id="preview" alt="preview">
      </div>
      <div class="image-input-box">
        <input id="imageCaption" class="image-input" placeholder="Añadir descripción (opcional)">
      </div>
      <div class="image-actions">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-messaging-compat.js"></script>

  <script>
    // ==================== CONFIGURACIÓN FIREBASE ====================
    const firebaseConfig = {
      apiKey: "AIzaSyCx75EIrWrRym40d3Ntjy8d_PjDy5V5Gp8",
      authDomain: "chat-online-f6753.firebaseapp.com",
      databaseURL: "https://chat-online-f6753-default-rtdb.firebaseio.com",
      projectId: "chat-online-f6753",
      storageBucket: "chat-online-f6753.appspot.com",
      messagingSenderId: "106228514889",
      appId: "1:106228514889:web:9dcfe5153d63eb55325a0c"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const database = firebase.database();
    const messagesRef = database.ref('brandon-chat/messages');
    const usersRef = database.ref('brandon-chat/usuarios');
    const tokensRef = database.ref('brandon-chat/tokens');

    const VAPID_KEY = 'BK0h1eQpoKAVQM8C8T7EO89wDQnpvQ3udV7hTKbrjzCP3DxntkvVgJqCeI12075fd9_mvyS-8gnWdDB6GqqpvDY';

    // ==================== VARIABLES GLOBALES ====================
    let user = JSON.parse(localStorage.getItem('brandon-user') || 'null');
    const chatMessages = document.getElementById('chatMessages');
    const messageInput = document.getElementById('messageInput');
    const attachMenu = document.getElementById('attachMenu');
    const attachToggleBtn = document.getElementById('attachToggleBtn');
    const mainSendBtn = document.getElementById('mainSendBtn');
    const sendIcon = document.getElementById('sendIcon');
    const inputWrapper = document.getElementById('inputWrapper');
    const cancelAudioBtn = document.getElementById('cancelAudioBtn');

    const notifToggleBtn = document.getElementById('notifToggleBtn');
    const notifToggleLabel = document.getElementById('notifToggleLabel');
    const notifFloatBtn = document.getElementById('notifFloatBtn');

    const displayedIds = new Set();
    let chatInitialized = false;
    let messaging = null;

    // ==================== HASH CONTRASEÑA ====================
    async function hashPassword(password) {
      const msgBuffer = new TextEncoder().encode(password);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // ==================== LOGIN / REGISTRO ====================
    const welcomeScreen = document.getElementById('welcomeScreen');
    const chatContainer = document.getElementById('chatContainer');
    const usernameInput = document.getElementById('usernameInput');
    const passwordInput = document.getElementById('passwordInput');
    const loginBtn = document.getElementById('loginBtn');

    function checkUser() {
      if (user && user.name) {
        welcomeScreen.style.display = 'none';
        chatContainer.style.display = 'flex';
        initChat();
      } else {
        welcomeScreen.style.display = 'flex';
        chatContainer.style.display = 'none';
      }
      updateNotifButtons();
    }

    loginBtn.addEventListener('click', async () => {
      const name = usernameInput.value.trim();
      const pass = passwordInput.value.trim();

      if (name.length < 2) return alert('El nombre debe tener al menos 2 letras.');
      if (pass.length < 4) return alert('La contraseña debe tener al menos 4 caracteres.');

      loginBtn.disabled = true;
      loginBtn.textContent = 'Verificando...';

      try {
        const hashedPass = await hashPassword(pass);
        const snapshot = await usersRef.orderByChild('name').equalTo(name).once('value');

        if (snapshot.exists()) {
          let isValid = false;
          let userId = null;

          snapshot.forEach(child => {
            if (child.val().password === hashedPass) {
              isValid = true;
              userId = child.key;
            }
          });

          if (isValid) {
            user = { id: userId, name: name };
            localStorage.setItem('brandon-user', JSON.stringify(user));
            welcomeScreen.style.display = 'none';
            chatContainer.style.display = 'flex';
            initChat();
            updateNotifButtons();
          } else {
            alert('Contraseña incorrecta. Intenta de nuevo.');
          }
        } else {
          const newUserRef = usersRef.push();
          await newUserRef.set({
            name: name,
            password: hashedPass,
            createdAt: firebase.database.ServerValue.TIMESTAMP
          });

          user = { id: newUserRef.key, name: name };
          localStorage.setItem('brandon-user', JSON.stringify(user));
          welcomeScreen.style.display = 'none';
          chatContainer.style.display = 'flex';
          initChat();
          updateNotifButtons();
        }
      } catch (error) {
        console.error(error);
        alert('Error de conexión. Revisa tu internet.');
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Registrarse';
      }
    });

    passwordInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') loginBtn.click();
    });

    // ==================== ACTUALIZAR BOTONES ====================
    function updateNotifButtons() {
      if (!('Notification' in window)) {
        notifToggleBtn.disabled = true;
        notifToggleBtn.classList.remove('enabled', 'blocked');
        notifToggleLabel.textContent = 'Notificaciones no soportadas';
        notifFloatBtn.classList.remove('off', 'on', 'blocked');
        notifFloatBtn.style.display = 'none';
        return;
      }

      const perm = Notification.permission;

      // Botón login
      if (perm === 'granted') {
        notifToggleBtn.classList.add('enabled');
        notifToggleBtn.classList.remove('blocked');
        notifToggleLabel.textContent = 'Notificaciones activadas';
      } else if (perm === 'denied') {
        notifToggleBtn.classList.add('blocked');
        notifToggleBtn.classList.remove('enabled');
        notifToggleLabel.textContent = 'Notificaciones bloqueadas';
      } else {
        notifToggleBtn.classList.remove('enabled', 'blocked');
        notifToggleLabel.textContent = 'Activar notificaciones';
      }

      // Botón flotante
      notifFloatBtn.classList.remove('off', 'on', 'blocked');
      if (perm === 'granted') {
        notifFloatBtn.classList.add('on');
        notifFloatBtn.title = 'Notificaciones activadas';
      } else if (perm === 'denied') {
        notifFloatBtn.classList.add('blocked');
        notifFloatBtn.title = 'Notificaciones bloqueadas';
      } else {
        notifFloatBtn.classList.add('off');
        notifFloatBtn.title = 'Activar notificaciones';
      }
    }

    // ==================== CLICK EN BOTONES ====================
    async function handleNotifButtonClick() {
      if (Notification.permission === 'granted') {
        const confirmDisable = confirm('¿Desactivar las notificaciones push?\n\nDejarás de recibir avisos de nuevos mensajes.');
        if (!confirmDisable) return;

        try {
          if (!messaging) messaging = firebase.messaging();
          const currentToken = await messaging.getToken({ vapidKey: VAPID_KEY });
          if (currentToken) {
            await messaging.deleteToken();
            if (user && user.id) await tokensRef.child(user.id).remove();
            console.log('🔕 Token eliminado');
            alert('Notificaciones desactivadas. Ya no recibirás avisos.');
          }
        } catch (err) {
          console.error('Error al desactivar:', err);
          alert('No se pudo desactivar. Intenta de nuevo.');
        } finally {
          updateNotifButtons();
        }
        return;
      }

      if (Notification.permission === 'denied') {
        alert('Las notificaciones están bloqueadas en tu navegador.\n\nDebes habilitarlas manualmente desde la configuración del sitio (icono del candado 🔒 en la barra de direcciones).');
        return;
      }

      notifToggleBtn.disabled = true;
      notifFloatBtn.disabled = true;
      notifToggleLabel.textContent = 'Solicitando permiso...';

      try {
        const granted = await requestNotificationPermission();
        if (granted) {
          alert('✅ ¡Notificaciones activadas!\n\nRecibirás avisos cuando lleguen mensajes nuevos.');
        } else {
          alert('No se activaron las notificaciones. Puedes intentarlo de nuevo más tarde.');
        }
      } catch (err) {
        console.error(err);
        alert('Error al activar notificaciones.');
      } finally {
        notifToggleBtn.disabled = false;
        notifFloatBtn.disabled = false;
        updateNotifButtons();
      }
    }

    notifToggleBtn.addEventListener('click', handleNotifButtonClick);
    notifFloatBtn.addEventListener('click', handleNotifButtonClick);

    // ==================== NOTIFICACIONES PUSH ====================
    async function requestNotificationPermission() {
      if (!('Notification' in window)) return null;

      if (Notification.permission === 'granted') {
        return await registerFCMToken();
      }

      if (Notification.permission === 'denied') return null;

      try {
        const permission = await Notification.requestPermission();
        if (permission === 'granted') {
          return await registerFCMToken();
        } else {
          return null;
        }
      } catch (err) {
        console.error('Error al pedir permiso:', err);
        return null;
      }
    }

    async function registerFCMToken() {
      if (!user || !user.id) {
        console.warn('No hay usuario logueado, no se guarda el token.');
        return null;
      }

      try {
        if ('serviceWorker' in navigator) {
          await navigator.serviceWorker.register('/firebase-messaging-sw.js', { scope: '/' });
          await navigator.serviceWorker.ready;
        }

        if (!messaging) messaging = firebase.messaging();

        const token = await messaging.getToken({ vapidKey: VAPID_KEY });
        if (!token) {
          console.warn('No se pudo obtener el token FCM.');
          return null;
        }

        console.log('✅ FCM Token:', token);

        await tokensRef.child(user.id).set({
          token: token,
          userName: user.name,
          userId: user.id,
          platform: navigator.platform || 'web',
          userAgent: navigator.userAgent,
          updatedAt: firebase.database.ServerValue.TIMESTAMP
        });

        messaging.onTokenRefresh(async () => {
          try {
            const newToken = await messaging.getToken({ vapidKey: VAPID_KEY });
            if (newToken && user && user.id) {
              await tokensRef.child(user.id).update({
                token: newToken,
                updatedAt: firebase.database.ServerValue.TIMESTAMP
              });
              console.log('🔄 Token renovado:', newToken);
            }
          } catch (e) {
            console.error('Error renovando token:', e);
          }
        });

        messaging.onMessage((payload) => {
          console.log('📩 Mensaje en foreground:', payload);
          const title = (payload.notification && payload.notification.title) || (payload.data && payload.data.title) || 'Babilonia777';
          const body = (payload.notification && payload.notification.body) || (payload.data && payload.data.body) || 'Nuevo mensaje';

          if (Notification.permission === 'granted') {
            new Notification(title, {
              body: body,
              icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">💬</text></svg>'
            });
          }
        });

        return token;
      } catch (err) {
        console.error('Error al registrar token FCM:', err);
        return null;
      }
    }

    // ==================== CLOUDINARY ====================
    async function uploadToCloudinary(blob, type) {
      return new Promise((resolve, reject) => {
        const fd = new FormData();
        fd.append('file', blob);
        fd.append('upload_preset', 'chat_images');
        fd.append('cloud_name', 'dymmyqlfw');
        if (type === 'audio') fd.append('folder', 'chat-brandon-audio');
        else fd.append('folder', 'chat-brandon-camera');

        const xhr = new XMLHttpRequest();
        xhr.open('POST', 'https://api.cloudinary.com/v1_1/dymmyqlfw/upload');
        xhr.upload.onprogress = (e) => {
          if (e.lengthComputable) {
            const p = Math.round((e.loaded / e.total) * 100);
            document.getElementById('uploadBar').style.width = p + '%';
            document.getElementById('uploadPercentage').textContent = p + '%';
          }
        };
        xhr.onload = () => {
          if (xhr.status >= 200 && xhr.status < 300) {
            const data = JSON.parse(xhr.responseText);
            resolve(data.secure_url || data.url);
          } else {
            reject('Error al subir a Cloudinary');
          }
        };
        xhr.onerror = () => reject('Error de red');
        xhr.send(fd);
      });
    }

    function showUploadOverlay() {
      document.getElementById('uploadOverlay').classList.add('active');
      document.getElementById('uploadBar').style.width = '0%';
      document.getElementById('uploadPercentage').textContent = '0%';
    }
    function hideUploadOverlay() {
      document.getElementById('uploadOverlay').classList.remove('active');
    }

    // ==================== CHAT ====================
    function initChat() {
      if (chatInitialized) return;
      chatInitialized = true;

      messagesRef.once('value', (snap) => {
        const msgs = [];
        snap.forEach(c => msgs.push({ id: c.key, ...c.val() }));
        msgs.sort((a,b) => (a.timestamp||0)-(b.timestamp||0));
        msgs.forEach(m => handleNewMessage(m.id, m));
      }).catch(err => console.error("Error cargando mensajes:", err));

      messagesRef.on('child_added', (s) => {
        if (!displayedIds.has(s.key)) handleNewMessage(s.key, s.val());
      });
    }

    function createMessageElement(id, msg) {
      const div = document.createElement('div');
      div.className = 'message ' + (msg.userId === user.id ? 'sent' : 'received');

      const nameDiv = document.createElement('div');
      nameDiv.className = 'message-username';
      nameDiv.textContent = msg.userName || 'Anónimo';
      div.appendChild(nameDiv);

      if (msg.text) {
        const t = document.createElement('div');
        t.className = 'message-text';
        t.textContent = msg.text;
        div.appendChild(t);
      }
      if (msg.imageUrl) {
        const c = document.createElement('div');
        c.className = 'message-image-container';
        const img = document.createElement('img');
        img.className = 'message-image';
        img.src = msg.imageUrl;
        img.onclick = () => window.open(msg.imageUrl, '_blank');
        c.appendChild(img);
        div.appendChild(c);
      }
      if (msg.audioUrl) {
        const c = document.createElement('div');
        c.className = 'message-audio-container';
        const a = document.createElement('audio');
        a.src = msg.audioUrl; a.controls = true;
        c.appendChild(a); div.appendChild(c);
      }
      return div;
    }

    function handleNewMessage(id, msg) {
      if (!id || !msg || displayedIds.has(id)) return;
      displayedIds.add(id);
      chatMessages.appendChild(createMessageElement(id, msg));
      chatMessages.scrollTo({ top: chatMessages.scrollHeight, behavior: 'smooth' });
    }

    // ==================== UI ====================
    attachToggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      attachMenu.classList.toggle('active');
      attachToggleBtn.classList.toggle('active');
    });
    document.addEventListener('click', (e) => {
      if (attachMenu.classList.contains('active') && !attachMenu.contains(e.target) && e.target !== attachToggleBtn) {
        attachMenu.classList.remove('active');
        attachToggleBtn.classList.remove('active');
      }
    });

    // ==================== ENVÍO TEXTO ====================
    mainSendBtn.addEventListener('click', (e) => {
      if (isRecording) {
        stopRecording(true);
        stopAudioStream();
      } else {
        const text = messageInput.value.trim();
        if (text) {
          messagesRef.push({
            text: text,
            userId: user.id,
            userName: user.name,
            timestamp: firebase.database.ServerValue.TIMESTAMP
          }).catch(err => alert("Error al enviar mensaje: " + err.message));
          messageInput.value = '';
        }
      }
    });

    // ==================== GRABACIÓN AUDIO ====================
    let audioStream = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    let isCanceling = false;
    let timerInterval = null;
    let seconds = 0;
    let isUploading = false;

    const iconSendHTML = `<line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>`;
    const iconStopHTML = `<rect x="6" y="6" width="12" height="12" rx="2" fill="white"/>`;

    async function startRecording() {
      if (isUploading) return;
      try {
        if (!audioStream) {
          audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        }
        mediaRecorder = new MediaRecorder(audioStream);
        audioChunks = [];
        isCanceling = false;

        mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };

        mediaRecorder.onstop = async () => {
          isRecording = false;
          clearInterval(timerInterval);
          mainSendBtn.classList.remove('recording');
          inputWrapper.classList.remove('recording');
          cancelAudioBtn.classList.remove('visible');
          sendIcon.innerHTML = iconSendHTML;
          messageInput.value = '';
          messageInput.placeholder = 'Escribe un mensaje...';
          messageInput.disabled = false;

          if (isCanceling) { isUploading = false; return; }

          const blob = new Blob(audioChunks, { type: 'audio/webm' });
          isUploading = true;
          showUploadOverlay();
          try {
            const url = await uploadToCloudinary(blob, 'audio');
            await messagesRef.push({
              audioUrl: url,
              userId: user.id,
              userName: user.name,
              timestamp: firebase.database.ServerValue.TIMESTAMP
            });
          } catch (e) {
            alert('Error al enviar audio: ' + e);
          } finally {
            hideUploadOverlay();
            isUploading = false;
          }
        };

        mediaRecorder.start();
        isRecording = true;
        mainSendBtn.classList.add('recording');
        inputWrapper.classList.add('recording');
        cancelAudioBtn.classList.add('visible');
        sendIcon.innerHTML = iconStopHTML;
        messageInput.placeholder = 'Grabando...';
        messageInput.disabled = true;
        seconds = 0;
        messageInput.value = '00:00';
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
          seconds++;
          const m = Math.floor(seconds / 60).toString().padStart(2, '0');
          const s = (seconds % 60).toString().padStart(2, '0');
          messageInput.value = `${m}:${s}`;
        }, 1000);
      } catch (err) {
        alert('Se necesita permiso del micrófono.');
      }
    }

    function stopRecording(send = true) {
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        isCanceling = !send;
        mediaRecorder.stop();
      }
    }

    function stopAudioStream() {
      if (audioStream) {
        audioStream.getTracks().forEach(track => track.stop());
        audioStream = null;
      }
    }

    function cancelRecording() {
      if (isRecording) stopRecording(false);
      stopAudioStream();
    }

    document.getElementById('micBtn').addEventListener('click', () => {
      attachMenu.classList.remove('active');
      attachToggleBtn.classList.remove('active');
      startRecording();
    });

    cancelAudioBtn.addEventListener('click', cancelRecording);

    // ==================== GALERÍA ====================
    const imageModal = document.getElementById('imagePreviewModal');
    let selectedImage = null;

    document.getElementById('galleryBtn').addEventListener('click', () => {
      attachMenu.classList.remove('active');
      attachToggleBtn.classList.remove('active');
      document.getElementById('realFileInput').click();
    });

    document.getElementById('realFileInput').addEventListener('change', (e) => {
      if (!e.target.files[0]) return;
      selectedImage = e.target.files[0];
      const reader = new FileReader();
      reader.onload = (ev) => {
        document.getElementById('preview').src = ev.target.result;
        imageModal.classList.add('active');
      };
      reader.readAsDataURL(selectedImage);
    });

    function closeImageModal() {
      imageModal.classList.remove('active');
      selectedImage = null;
      document.getElementById('realFileInput').value = '';
      document.getElementById('imageCaption').value = '';
    }
    document.getElementById('cancelImageBtn').addEventListener('click', closeImageModal);
    document.getElementById('cancelImageBtn2').addEventListener('click', closeImageModal);

    document.getElementById('sendImageBtn').addEventListener('click', async () => {
      if (!selectedImage) return;
      showUploadOverlay();
      try {
        const url = await uploadToCloudinary(selectedImage, 'image');
        const caption = document.getElementById('imageCaption').value.trim();
        const payload = {
          imageUrl: url,
          userId: user.id,
          userName: user.name,
          timestamp: firebase.database.ServerValue.TIMESTAMP
        };
        if (caption) payload.text = caption;
        await messagesRef.push(payload);
        closeImageModal();
      } catch (e) {
        alert('Error al enviar imagen: ' + e);
      } finally {
        hideUploadOverlay();
      }
    });

    // ==================== CÁMARA ====================
    const camOverlay = document.getElementById('cameraOverlay');
    const video = document.getElementById('cameraVideoElement');
    const canvas = document.getElementById('cameraCanvas');
    const previewResult = document.getElementById('cameraPreviewResult');
    const cameraSwitchBtn = document.getElementById('cameraSwitchBtn');
    const cameraFlashBtn = document.getElementById('cameraFlashBtn');

    let camStream = null;
    let camBlob = null;
    let isFrontCamera = false;
    let isFlashOn = false;

    async function startCamera() {
      try {
        if (camStream) camStream.getTracks().forEach(t => t.stop());
        camStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: isFrontCamera ? 'user' : 'environment' }
        });
        video.srcObject = camStream;
        if (isFrontCamera) video.style.transform = 'scaleX(-1)';
        else video.style.transform = 'none';
        isFlashOn = false;
        cameraFlashBtn.classList.remove('flash-active');
      } catch (e) {
        alert('Error al acceder a la cámara. Verifica los permisos.');
      }
    }

    function stopCamera() {
      if (camStream) {
        camStream.getTracks().forEach(track => track.stop());
        camStream = null;
      }
      camOverlay.classList.remove('active');
    }

    document.getElementById('cameraBtn').addEventListener('click', () => {
      attachMenu.classList.remove('active');
      attachToggleBtn.classList.remove('active');
      camOverlay.classList.add('active');
      previewResult.style.display = 'none';
      video.style.display = 'block';
      document.getElementById('retakeBtn').style.display = 'none';
      document.getElementById('sendMediaBtn').style.display = 'none';
      document.getElementById('captureBtn').style.display = 'block';
      isFrontCamera = false;
      startCamera();
    });

    cameraSwitchBtn.addEventListener('click', () => {
      isFrontCamera = !isFrontCamera;
      startCamera();
    });

    cameraFlashBtn.addEventListener('click', async () => {
      if (!camStream) return;
      try {
        const track = camStream.getVideoTracks()[0];
        const capabilities = track.getCapabilities();
        if (capabilities.torch) {
          isFlashOn = !isFlashOn;
          await track.applyConstraints({ advanced: [{ torch: isFlashOn }] });
          if (isFlashOn) cameraFlashBtn.classList.add('flash-active');
          else cameraFlashBtn.classList.remove('flash-active');
        } else {
          alert('El flash no está disponible para esta cámara o dispositivo.');
        }
      } catch (err) {
        console.warn('Error al intentar encender el flash:', err);
      }
    });

    document.getElementById('captureBtn').addEventListener('click', () => {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      if (isFrontCamera) {
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
      }
      ctx.drawImage(video, 0, 0);
      canvas.toBlob(blob => {
        camBlob = blob;
        previewResult.src = URL.createObjectURL(blob);
        previewResult.style.display = 'block';
        video.style.display = 'none';
        document.getElementById('retakeBtn').style.display = 'block';
        document.getElementById('sendMediaBtn').style.display = 'block';
        document.getElementById('captureBtn').style.display = 'none';
        if (isFlashOn) {
          const track = camStream.getVideoTracks()[0];
          track.applyConstraints({ advanced: [{ torch: false }] });
          cameraFlashBtn.classList.remove('flash-active');
          isFlashOn = false;
        }
      }, 'image/jpeg', 0.9);
    });

    document.getElementById('retakeBtn').addEventListener('click', () => {
      camBlob = null;
      previewResult.style.display = 'none';
      video.style.display = 'block';
      document.getElementById('retakeBtn').style.display = 'none';
      document.getElementById('sendMediaBtn').style.display = 'none';
      document.getElementById('captureBtn').style.display = 'block';
    });

    document.getElementById('sendMediaBtn').addEventListener('click', async () => {
      if (!camBlob) return;
      showUploadOverlay();
      try {
        const url = await uploadToCloudinary(camBlob, 'image');
        await messagesRef.push({
          imageUrl: url,
          userId: user.id,
          userName: user.name,
          timestamp: firebase.database.ServerValue.TIMESTAMP
        });
        stopCamera();
      } catch (e) {
        alert('Error al enviar: ' + e);
      } finally {
        hideUploadOverlay();
      }
    });

    document.getElementById('closeCameraBtn').addEventListener('click', stopCamera);

    // ==================== VISIBILIDAD ====================
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        if (isRecording) cancelRecording();
        if (camOverlay.classList.contains('active')) stopCamera();
      }
    });

    // ==================== INICIO ====================
    checkUser();
  </script>
</body>
</html>
