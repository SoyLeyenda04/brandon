<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Babilonia777</title>
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💬</text></svg>">
  
  <!-- CSS modular -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/chat.css">
  <link rel="stylesheet" href="css/modals.css">
  <link rel="stylesheet" href="css/camera.css">
</head>
<body>
  <!-- PANTALLA DE LOGIN / REGISTRO -->
  <div class="welcome-screen" id="welcomeScreen" style="display: none;">
    <div class="welcome-card">
      <div class="welcome-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </div>
      
      <div class="input-group">
        <input type="text" id="usernameInput" class="welcome-input" placeholder="Nombre de usuario" autocomplete="off" maxlength="15">
      </div>
      
      <div class="input-group">
        <input type="password" id="passwordInput" class="welcome-input" placeholder="Contraseña" maxlength="20">
      </div>
      
      <button id="loginBtn" class="welcome-btn">Registrarse</button>

      <div class="warning-note">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
          <line x1="12" y1="9" x2="12" y2="13"/>
          <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
        Por favor, anota tu usuario y contraseña en un lugar seguro.
      </div>
    </div>
  </div>

  <!-- CHAT -->
  <div class="chat-container" id="chatContainer" style="display: none;">
    <div class="chat-messages" id="chatMessages"></div>

    <form class="input-area" id="messageForm" onsubmit="return false;">
      <div class="attach-menu" id="attachMenu">
        <button type="button" class="attach-option" id="micBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
          Audio
        </button>
        <button type="button" class="attach-option" id="cameraBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          Cámara
        </button>
        <button type="button" class="attach-option" id="galleryBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          Galería
        </button>
      </div>

      <div class="input-wrapper" id="inputWrapper">
        <button type="button" class="icon-btn" id="attachToggleBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        
        <button type="button" class="cancel-audio-btn" id="cancelAudioBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>

        <input type="text" class="message-input" id="messageInput" placeholder="Escribe un mensaje..." autocomplete="off">
        
        <button type="button" class="send-btn" id="mainSendBtn">
          <svg id="sendIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </form>
  </div>

  <!-- INPUTS OCULTOS Y OVERLAYS -->
  <input type="file" id="realFileInput" accept="image/*" style="display:none">

  <!-- MODAL PREVIEW IMAGEN -->
  <div id="imagePreviewModal" class="overlay">
    <div class="modal-card image-modal">
      <div class="modal-head">
        <div class="modal-title">Enviar imagen</div>
        <button class="close-btn" id="cancelImageBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="image-preview-box">
        <img id="preview" alt="preview">
      </div>
      <div class="image-input-box">
        <input id="imageCaption" class="image-input" placeholder="Añadir descripción (opcional)">
      </div>
      <div class="image-actions">
        <button class="btn-pill cancel" id="cancelImageBtn2" style="flex:1; justify-content:center;">Cancelar</button>
        <button class="btn-pill send" id="sendImageBtn" style="flex:1.5; justify-content:center;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          Enviar
        </button>
      </div>
    </div>
  </div>

  <!-- OVERLAY CÁMARA -->
  <div id="cameraOverlay" class="overlay camera-overlay">
    <div class="camera-container">
      <div class="camera-preview">
        <video id="cameraVideoElement" autoplay playsinline></video>
        <canvas id="cameraCanvas" style="display:none"></canvas>
        <img id="cameraPreviewResult" class="camera-preview-result" alt="preview">
        
        <div class="camera-close-btn">
          <button class="camera-icon-btn" id="closeCameraBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        
        <div class="camera-corner-actions">
          <button class="camera-icon-btn" id="cameraFlashBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          </button>
          <button class="camera-icon-btn" id="cameraSwitchBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
          </button>
        </div>
      </div>
      <div class="camera-bottom-bar">
        <button class="btn-outline" id="retakeBtn" style="display:none">Repetir</button>
        <button class="camera-capture-btn" id="captureBtn"></button>
        <button class="btn-outline" id="sendMediaBtn" style="display:none; color: var(--accent); border-color: var(--accent);">Enviar</button>
      </div>
    </div>
  </div>

  <!-- OVERLAY DE SUBIDA -->
  <div id="uploadOverlay" class="overlay">
    <div class="modal-card upload-modal">
      <div class="upload-title">Subiendo archivo...</div>
      <div class="progress-bar"><div id="uploadBar" class="progress-fill"></div></div>
      <div id="uploadPercentage">0%</div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

  <!-- Scripts modulares -->
  <script src="js/firebase-config.js"></script>
  <script src="js/cloudinary.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/gallery.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
